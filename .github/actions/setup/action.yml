name: Setup
description: Install Node and dependencies (and optionally Playwright browsers)
inputs:
  browsers:
    description: Space-separated Playwright browsers to install (empty = none)
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci
      shell: bash
    - if: inputs.browsers != ''
      run: npx playwright install --with-deps ${{ inputs.browsers }}
      shell: bash
