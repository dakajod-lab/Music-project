# Pipeline 3: after a merge to main, test again, deploy to GitHub Pages and smoke test the live site.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/_tests.yml
    with:
      suite: all
      projects: tier1

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Smoke test live site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
      - name: Run @smoke scenarios against the deployed app
        env:
          BASE_URL: ${{ needs.deploy.outputs.url }}
        run: |
          npm run gen:audio
          npx bddgen
          npx playwright test --project=chromium-desktop --project=chromium-android --grep @smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-report
          path: playwright-report
          retention-days: 14
