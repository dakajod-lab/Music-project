version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    # Also scan the shared composite action (setup-node etc.), not only the workflows.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
